<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VirtuLearn - Basler Fasnacht</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="app-header">
    <div class="branding">
        <h1>VirtuLearn</h1>
        <p>Discover Basler Fasnacht</p>
    </div>


    <select id="language-select" aria-label="Sprache">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
        <option value="fr">Français</option>
    </select>
</header>

<nav class="page-navigation" aria-label="Seitennavigation">
    <button
            id="show-exhibition"
            class="active"
            type="button"
            aria-current="page">
        Ausstellung
    </button>

    <button id="show-explore" type="button">
        Sammlung
    </button>
</nav>

<main class="app-content">

    <section id="exhibition-page">

        <article class="exhibit-card">

            <button id="open-ar-button" type="button">
                In AR ansehen
            </button>

            <div class="viewer-container">
                <div id="viewer"></div>

                <span id="object-title" class="viewer-title">
                    Waggis-Maske
                </span>
            </div>

            <div class="object-navigation">
                <button id="previous-button" type="button">
                    ← Zurück
                </button>

                <span id="object-counter">1 / 3</span>

                <button id="next-button" type="button">
                    Weiter →
                </button>
            </div>

        </article>

    </section>
    <section id="explore-page" hidden>

        <div class="page-intro">
            <span class="eyebrow">DIGITALE SAMMLUNG</span>

            <h2>Weitere Objekte entdecken.</h2>

            <p>
                Durchsuche das digitale Fasnachtsarchiv.
            </p>
        </div>

        <div class="search-bar">
            <input
                    id="search-input"
                    type="search"
                    placeholder="Wonach suchst du?"
                    aria-label="Suchbegriff"
            >

            <button id="search-button" type="button">
                Suchen
            </button>
        </div>
        <article id="explore-results" class="exhibit-card search-results" hidden>
            <button id="open-ar-button-explore" type="button">
                In AR ansehen
            </button>

            <div class="viewer-container">
                <div id="explore-viewer"></div>
            </div>

            <div class="object-navigation">
                <button id="previous-button-explore" type="button">
                    ← Zurück
                </button>

                <span id="explore-object-counter">1 / 1</span>

                <button id="next-button-explore" type="button">
                    Weiter →
                </button>
            </div>

        </article>

    </section>
</main>
<model-viewer
        id="ar-model"
        class="ar-model"
        ar
        ar-modes="webxr scene-viewer quick-look"
        alt="3D-Modell in Augmented Reality">
</model-viewer>

<model-viewer
        id="ar-model-explore"
        class="ar-model"
        ar
        ar-modes="webxr scene-viewer quick-look"
        alt="3D-Modell aus der Sammlung in Augmented Reality">
</model-viewer>

    <script type="module" src="./src/main.js"></script>
</body>
</html>
