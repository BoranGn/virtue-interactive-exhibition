<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VirtuLearn - Basler Fasnacht</title>
    <link rel="stylesheet" href="src/styles/style.css">
</head>

<body>

<!-- Application header -->
<header class="app-header">

    <div class="branding-group">
        <img
                src="/assets/waggis.png"
                alt="Waggislarve"
                class="header-waggis"
        >

        <div class="branding">
            <h1>VirtuLearn</h1>
            <p>Discover Basler Fasnacht</p>
        </div>
    </div>

    <select id="language-select" aria-label="language">
        <option value="de">Deutsch</option>
        <option value="en">English</option>
    </select>

    <img
            src="/assets/unibas-logo.png"
            alt="Universität Basel"
            class="unibas-logo"
    >

</header>

<main class="app-content">

    <!-- Welcome page -->
    <section id="welcome-page">

        <h2 id="welcome-title"></h2>

        <p id="welcome-description"></p>

        <nav class="station-navigation">
            <a id="masks-link" href="?station=masks"></a>

            <a id="music-link" href="?station=music"></a>

            <a id="archive-link" href="?station=archive"></a>
        </nav>
    </section>

    <!-- Exhibition page -->
    <section id="exhibition-page" hidden>

        <!-- Mask quiz -->
        <article id="mask-quiz" class="exhibit-card" hidden>

            <h2 id="quiz-title"></h2>

            <p id="quiz-instructions"></p>

            <p id="quiz-verse" class="quiz-verse"></p>

            <div id="quiz-answers" class="quiz-answers"></div>

            <p
                    id="quiz-feedback"
                    class="quiz-feedback"
                    aria-live="polite">
            </p>
            <div class="object-navigation">

                <button id="quiz-previous-button"
                        type="button"
                        disabled>
                </button>

                <span id="quiz-counter"></span>
            </div>

        </article>

        <!-- Music station -->
        <article id="music-station" class="exhibit-card" hidden>

            <h2 id="music-title"></h2>

            <p id="music-instructions"></p>

            <div id="music-instruments" class="music-grid">

                <div class="music-card">

                    <h3 id="piccolo-title"></h3>

                    <p id="piccolo-description"></p>

                    <button
                            id="piccolo-listen-button"
                            type="button">

                    </button>

                    <button id="piccolo-view-button"
                            type="button">

                    </button>

                </div>

                <div class="music-card">

                    <h3 id="drum-title"></h3>

                    <p id="drum-description"></p>

                    <button
                            id="drum-listen-button"
                            type="button">
                    </button>

                    <button
                            id="drum-view-button"
                            type="button">
                    </button>

                </div>

            </div>

        </article>

        <!-- Fullscreen viewer for stations 1 and 2 -->
        <article
                id="exhibition-viewer"
                class="fullscreen-viewer"
                hidden>

            <div class="viewer-toolbar">
                <span
                        id="exhibition-object-title"
                        class="viewer-title">

                </span>

            </div>


            <div class="viewer-container">

                <div id="exhibition-media-container"></div>


                <div
                        id="viewer-hint"
                        class="viewer-hint">

                    <div class="viewer-hint-glow"></div>

                    <span class="viewer-hint-text"></span>

                </div>

                <p id="exhibition-object-description"
                   class="object-info"
                   hidden>
                </p>

            </div>

            <div class="object-navigation viewer-actions">

                <span id="exhibition-object-counter"></span>

                <button id="exhibition-previous-button" type="button"></button>

                <button id="exhibition-open-ar-button" type="button"></button>

                <button id="exhibition-next-button" type="button"></button>

            </div>

        </article>

    </section>

    <!-- Explore page -->
    <section id="explore-page" hidden>

        <div class="page-intro">
            <span id="explore-eyebrow" class="eyebrow"></span>

            <h2 id="explore-title"></h2>

            <p id="explore-description"></p>

        </div>

        <!-- Search interface -->
        <div class="search-bar">

            <input
                    id="explore-search-input"
                    type="search"
                    aria-label="Search term"
            >

            <button id="explore-search-button" type="button"></button>

        </div>
        <!-- Search results viewer -->
        <article id="explore-results" class="exhibit-card search-results" hidden>


            <span id="explore-object-counter"> </span>

            <div class="viewer-container">
                <div id="explore-media-container"></div>
            </div>

            <div class="object-navigation">

                <button
                        id="explore-previous-button"
                        type="button">
                </button>

                <button
                        id="open-ar-button-explore"
                        type="button">
                </button>

                <button id="next-button-explore"
                        type="button">
                </button>

            </div>

        </article>

    </section>
</main>

<!-- AR components -->
<model-viewer
        id="exhibition-ar-model"
        class="ar-model"
        ar
        ar-modes="scene-viewer quick-look "
        alt="3D model in augmented reality">
</model-viewer>

<model-viewer
        id="explore-ar-model"
        class="ar-model"
        ar
        ar-modes="scene-viewer quick-look "
        alt="3D model from the collection in augmented reality">
</model-viewer>

<!-- Scripts -->
<script src="/ogv/ogv.js"></script>
<script type="module" src="./src/main.js"></script>

</body>
</html>
